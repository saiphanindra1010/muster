name: Build desktop apps

# Every merge to main builds the Windows, macOS and Linux installers and keeps
# them as workflow artifacts. Pushing a tag like v0.2.0 also creates a draft
# GitHub release with the installers attached, for you to review and publish.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"
  # Same pin as `@opencode/cli` installed on the dev machine.
  OPENCODE_CLI_VERSION: "2.2.7"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: windows-x64
            bundle_glob: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            label: linux-x64
            bundle_glob: src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Pinned by src-tauri/rust-toolchain.toml. rustup reads that file on its
      # own, so this only makes sure the toolchain is installed.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install the OpenCode harness
        shell: bash
        run: |
          bun install -g --trust "@opencode/cli@${OPENCODE_CLI_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Check the OpenCode harness
        shell: bash
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          command -v opencode
          opencode --version

      # Copies the harness into src-tauri/binaries/ as the sidecar that the
      # desktop app launches. The file is gitignored, so CI stages it every time.
      - name: Stage the OpenCode sidecar
        shell: bash
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bash scripts/stage-opencode.sh

      # Each OS picks up its own src-tauri/tauri.<os>.conf.json automatically
      # (dmg on macOS, nsis on Windows, deb on Linux).
      - name: Build the installer
        run: bun run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: muster-${{ matrix.label }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create a draft release with all installers
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
