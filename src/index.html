<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Muster</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c7df6'/%3E%3Crect x='8' y='11' width='16' height='12' rx='3.5' fill='%23fff'/%3E%3Ccircle cx='13' cy='16.5' r='1.6' fill='%237c7df6'/%3E%3Ccircle cx='19' cy='16.5' r='1.6' fill='%237c7df6'/%3E%3Cpath d='M13.5 20.5h5' stroke='%237c7df6' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M16 11V8' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='6.8' r='1.4' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Appearance before first paint — no flash of the wrong theme.
      (function () {
        try {
          var a = localStorage.getItem("muster:appearance") || "system";
          var dark =
            a === "dark" ||
            (a === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
